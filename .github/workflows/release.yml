# The only workflow. Releases happen by pushing a v* tag (`make release`):
# checks and every test on a clean machine, a build for the /how-things-work/
# sub-path, the GitHub Pages deploy, then a smoke test of the live site.
#
# Rollback (`make rollback`) runs the same full validation for an earlier tag.
# No deployment can bypass the full suite. Tags are never moved.
#
# Repository settings this needs: Settings → Pages → Source: GitHub Actions;
# Settings → Environments → github-pages → deployment rules allowing the tags
# v* and the branch main (the rollback runs from main). No secrets: Pages
# deploys with the workflow's OIDC token.
name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Rollback to {0}', inputs.tag) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (rollback), e.g. v0.3.0
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  REF: ${{ inputs.tag || github.ref }}

jobs:
  # Every deployment, including rollback, must pass a fresh full run. The site is built once;
  # the browser tests run on that build in four parallel shards while `check` runs the static
  # and model checks, and deploy uploads exactly the build the shards tested.
  build:
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate rollback tag
        if: github.event_name == 'workflow_dispatch'
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
        run: '[[ "$ROLLBACK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      # No npm cache: caches made by a tag's run are scoped to that tag, so no later release
      # could restore them, and npm ci takes 3 s anyway.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # The command playwright.config.ts's web server runs before serving.
      - run: BASE_PATH=/how-things-work npm run build
      - id: version
        run: echo "version=$(node -p "require('./build/_app/version.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  check:
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Validate rollback tag
        if: github.event_name == 'workflow_dispatch'
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
        run: '[[ "$ROLLBACK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Full formatting, lint, types and model tests
        run: make check

  e2e:
    needs: build
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 20
    strategy:
      # Let every shard finish, so one run reports all the failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # Headless runs use only Chromium's headless shell, not the full browser or ffmpeg.
      - run: npx playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
      - run: mkdir build && tar -xf artifact.tar -C build && rm artifact.tar
      # Serve the downloaded build instead of building again. The override is written here,
      # not committed, so a rollback to a tag from before this workflow works the same way.
      # playwright.config.ts never narrows topics (only playwright.changed.config.ts does).
      - name: Point the browser tests at the tested build
        run: |
          cat > playwright.ci.config.ts <<'EOF'
          import base from './playwright.config';
          const port = Number(process.env.PW_PORT ?? 4180);
          export default {
            ...base,
            webServer: { ...base.webServer, command: `node scripts/serve-pages.mjs build /how-things-work ${port}` }
          };
          EOF
      - name: Full browser suite on the production build, shard ${{ matrix.shard }} of 4
        run: npx playwright test -c playwright.ci.config.ts --shard=${{ matrix.shard }}/4 --workers=6
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [build, check, e2e]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script comes from the workflow's own ref (the tag, or main for a
      # rollback), so it is there even when an old tag is redeployed.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Smoke test of the live site
        run: node scripts/verify-live.mjs "${{ needs.build.outputs.version }}"
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
