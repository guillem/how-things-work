# The only workflow. Releases happen by pushing a v* tag (`make release`):
# checks and every test on a clean machine, a build for the /how-things-work/
# sub-path, the GitHub Pages deploy, then a smoke test of the live site.
#
# Rollback (`make rollback`) runs the same full validation for an earlier tag.
# No deployment can bypass the full suite. Tags are never moved.
#
# Repository settings this needs: Settings → Pages → Source: GitHub Actions;
# Settings → Environments → github-pages → deployment rules allowing the tags
# v* and the branch main (the rollback runs from main). No secrets: Pages
# deploys with the workflow's OIDC token.
name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Rollback to {0}', inputs.tag) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (rollback), e.g. v0.3.0
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  REF: ${{ inputs.tag || github.ref }}

jobs:
  build:
    # Every deployment, including rollback, must pass a fresh full run.
    # Upload the build produced by the browser tests: deploy exactly what passed.
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate rollback tag
        if: github.event_name == 'workflow_dispatch'
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
        run: '[[ "$ROLLBACK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Full formatting, lint, types and model tests
        run: make check
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts never narrows topics (only playwright.changed.config.ts does).
      - name: Full browser suite on the production build
        run: make e2e-full
      - id: version
        run: echo "version=$(node -p "require('./build/_app/version.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script comes from the workflow's own ref (the tag, or main for a
      # rollback), so it is there even when an old tag is redeployed.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Smoke test of the live site
        run: node scripts/verify-live.mjs "${{ needs.build.outputs.version }}"
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
